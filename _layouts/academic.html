<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == '/' %}Zhen Wei — Neuroscience &amp; Perception{% else %}{{ page.title | escape }} — Zhen Wei{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | escape }} — Zhen Wei">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | escape }}">
  <meta property="og:image" content="{{ '/images/profile(1).jpg' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="{{ '/assets/images/monogram.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}?v=scholar-details-1">
  <script src="{{ '/assets/js/academic.js' | relative_url }}" defer></script>
</head>
<body class="academic-site{% if page.url == '/' %} home-page{% endif %}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Zhen Wei — home">Zhen Wei</a>
      <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="primary-navigation"><span></span><span></span></button>
      <nav class="site-nav" id="primary-navigation" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}#about"{% if page.url == '/' %} class="active" aria-current="page"{% endif %}>About</a>
        <a href="{{ '/' | relative_url }}#research">Research</a>
        <a href="{{ '/publications/' | relative_url }}"{% if page.url == '/publications/' %} class="active" aria-current="page"{% endif %}>Publications</a>
        <a href="{{ '/portfolio/' | relative_url }}"{% if page.url contains '/portfolio' %} class="active" aria-current="page"{% endif %}>Portfolio</a>
        <a href="{{ '/cv/' | relative_url }}"{% if page.url == '/cv/' %} class="active" aria-current="page"{% endif %}>CV</a>
        <a class="nav-contact" href="{{ '/' | relative_url }}#contact">Contact</a>
      </nav>
    </div>
  </header>
  <main id="main-content" tabindex="-1">{{ content }}</main>
  <footer class="site-footer"><div class="shell footer-inner"><span>© {{ site.time | date: '%Y' }} Zhen Wei</span><a href="{{ '/' | relative_url }}#about">Back to top</a></div></footer>
</body>
</html>
